name: Build Caddy L4

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-l4/**'
      - '.github/workflows/caddy-l4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get and print Caddy version
        id: caddy_version
        run: |
          full_version=$(docker run --rm caddy:latest caddy version)
          version=$(echo "$full_version" | awk '{print $1}')
          echo "Full caddy version: $full_version"
          echo "Tag version: $version"
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: caddy-l4
          file: caddy-l4/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-l4:latest
            ghcr.io/${{ github.repository_owner }}/caddy-l4:${{ steps.caddy_version.outputs.version }}
